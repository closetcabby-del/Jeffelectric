<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Send a Photo | Jeff Electric</title><meta name="description" content="Send Jeff Electric a photo of your electrical issue and a few basic details so our team can review your request."><meta name="robots" content="noindex,follow"><link rel="icon" href="../public/favicon.png"><style>:root{--gold:#f2b21a;--bg:#080908;--panel:#151715;--line:#34372f;--text:#fff;--muted:#b8bbb3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}main{min-height:100vh;display:grid;place-items:center;padding:28px 18px}.card{width:min(680px,100%);background:var(--panel);border:1px solid var(--line);box-shadow:10px 10px 0 #000;padding:28px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}.brand img:first-child{width:42px;height:42px;object-fit:contain}.brand img:last-child{width:150px;height:auto}.eyebrow{color:var(--gold);font-size:11px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}.card h1{font-size:clamp(38px,8vw,62px);line-height:.95;letter-spacing:-.045em;margin:14px 0}.card h1 em{color:var(--gold);font-style:normal}.intro{color:var(--muted);line-height:1.65;margin:0 0 26px;font-size:15px}form{display:grid;gap:16px}label{display:block;color:#d6d8d2;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}input,textarea{width:100%;margin-top:8px;padding:15px;border:1px solid #464a40;background:#0c0d0c;color:#fff;font:inherit;outline:none}input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 2px #f2b21a22}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.photo{padding:18px;border:1px dashed #6a684f;background:#10110f}.photo input{padding:10px;background:#0a0b0a}.hint{display:block;margin-top:8px;color:#8f938a;font-size:11px;line-height:1.5;text-transform:none;letter-spacing:0;font-weight:400}.button{min-height:56px;border:0;background:var(--gold);color:#111;font-weight:900;text-transform:uppercase;letter-spacing:.08em;cursor:pointer}.button:disabled{opacity:.6;cursor:wait}.privacy{color:#858980;font-size:11px;line-height:1.5;margin:0}.call{display:block;margin-top:20px;text-align:center;color:#fff;text-decoration:none;font-weight:800}.call span{color:var(--gold)}.site-link{display:block;margin-top:10px;text-align:center;color:#777c73;text-decoration:none;font-size:11px;letter-spacing:.04em}.site-link:hover{color:#b9bcb4}.success{padding:34px 4px}.success h2{font-size:30px;margin:0 0 12px}.success p{color:var(--muted);line-height:1.6}.success-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}.success-actions a{min-height:50px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-weight:900;text-transform:uppercase;letter-spacing:.06em;font-size:11px}.success-actions a:first-child{background:var(--gold);color:#111}.success-actions a:last-child{border:1px solid #5a5e52;color:#fff}@media(max-width:600px){main{padding:18px 12px;align-items:start}.card{padding:22px 18px;box-shadow:6px 6px 0 #000}.row,.success-actions{grid-template-columns:1fr}.card h1{font-size:44px}.brand{margin-bottom:20px}}</style></head><body><main><section class="card"><a class="brand" href="../" aria-label="Jeff Electric home"><img src="../public/brand/jeff-electric-mark.png" alt=""><img src="../public/brand/jeff-electric-wordmark.png" alt="Jeff Electric"></a><p class="eyebrow">Quick photo request</p><h1>Show us what<br><em>you’re seeing.</em></h1><p class="intro">Send a photo and a few basic details. You do not need to know the technical name of the problem.</p><form id="photo-form" enctype="multipart/form-data"><input type="hidden" name="_subject" value="Photo request from jeffelectric.online/send-photo"><div class="row"><label>Full name<input required autocomplete="name" name="fi-sender-firstName" placeholder="Your name"></label><label>Phone number<input required type="tel" autocomplete="tel" name="fi-phone-phoneNumber" placeholder="(000) 000-0000"></label></div><label>ZIP code<input required inputmode="numeric" autocomplete="postal-code" name="fi-text-zipCode" placeholder="77502"></label><label>What are you seeing?<textarea required name="fi-text-message" rows="4" placeholder="Example: breaker keeps tripping, outlet stopped working, panel looks damaged, I want an EV charger, etc."></textarea></label><label class="photo">Add a photo<input type="file" name="fi-file-photo" accept="image/*" capture="environment"><span class="hint">Optional, but helpful. On a phone you can choose an existing image or take a new photo.</span></label><input type="hidden" name="fi-select-serviceType" value="Something else"><input type="hidden" name="fi-select-preferredContact" value="Phone call"><button class="button" type="submit">Send to Jeff Electric →</button><p class="privacy">Your information and photo are used only to respond to this service request.</p></form><a class="call" href="tel:+13463984485">Prefer to talk? <span>Call (346) 398-4485</span></a><a class="site-link" href="../">Visit jeffelectric.online</a></section></main><script src="https://forminit.com/sdk/v1/forminit.js"></script><script>const form=document.getElementById('photo-form');const phone=form.querySelector('input[name="fi-phone-phoneNumber"]');phone.addEventListener('input',()=>{const n=phone.value.replace(/\D/g,'').slice(0,10);phone.value=n.length>6?'('+n.slice(0,3)+') '+n.slice(3,6)+'-'+n.slice(6):n.length>3?'('+n.slice(0,3)+') '+n.slice(3):n});form.addEventListener('submit',async e=>{e.preventDefault();const btn=form.querySelector('button');const data=new FormData(form);const digits=String(data.get('fi-phone-phoneNumber')||'').replace(/\D/g,'');if(digits.length===10)data.set('fi-phone-phoneNumber','+1'+digits);else if(digits.length===11&&digits.startsWith('1'))data.set('fi-phone-phoneNumber','+'+digits);btn.disabled=true;btn.textContent='Sending…';try{if(!window.Forminit)throw new Error('Forminit SDK did not load');const client=new Forminit();const result=await client.submit('pojgp0vhkve',data);if(result&&!result.error){form.outerHTML='<div class="success" role="status"><h2>Request received.</h2><p>We’ll review what you sent and follow up shortly.</p><div class="success-actions"><a href="tel:+13463984485">Call Jeff Electric</a><a href="../">View Our Website</a></div></div>'}else throw new Error(result&&result.error?result.error.message:'Submission failed')}catch(err){console.error(err);btn.disabled=false;btn.textContent='Send to Jeff Electric →';alert('Sorry, the request did not send. Please call Jeff Electric at (346) 398-4485.')}});</script></body></html>
