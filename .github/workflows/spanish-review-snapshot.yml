name: Spanish review snapshot (no deployment)
on:
  push:
    branches: [feature/spanish-homepage-review]
    paths: [.github/workflows/spanish-review-snapshot.yml, scripts/build-spanish-homepage.py]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build static Spanish draft
        run: python3 scripts/build-spanish-homepage.py
      - name: Export draft for isolated local testing
        run: git ls-files -z --cached --others --exclude-standard | tar --null -T - -czf ../website-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: spanish-review-source
          path: ../website-source.tar.gz
          retention-days: 1
          if-no-files-found: error
