name: Spanish review snapshot (no deployment)
on:
  push:
    branches: [feature/spanish-homepage-review]
    paths: [.github/workflows/spanish-review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Export tracked source for isolated local testing
        run: git archive --format=tar.gz --output=website-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: spanish-review-source
          path: website-source.tar.gz
          retention-days: 1
          if-no-files-found: error
